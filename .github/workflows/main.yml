name: Manual Input Demo

# 1. Define the workflow_dispatch trigger to accept inputs
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Select branch'
        required: true
        type: choice
        options:
          - master
          - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 2. Access inputs using the ${{ inputs.input_name }} syntax
      - name: Log the user inputs
        run: |
          echo "The selected environment is: ${{ inputs.branch }}"

      # 3. Use an input inside a conditional 'if' statement
      - name: Optional Testing Step
        if: ${{ inputs.branch == "develop" }}
        run: |
          exit 1
